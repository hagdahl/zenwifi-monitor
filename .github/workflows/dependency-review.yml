# ZenWiFi Monitor version: 0.1.0
name: dependency-review

# The dependency set is hash-locked, which is what stops a substituted artefact
# reaching a service that can restart a router. The same property stops it ever
# updating on its own, so this runs weekly to say what has moved and what is
# known to be vulnerable — and then stops. It opens no pull request and changes
# no file. An upgrade means regenerating the lock with `--generate-hashes` and
# running both platforms' suites, which is a decision, not a merge.
on:
  schedule:
    # Monday morning UTC. A weekly cadence is deliberate: a daily check produces
    # an issue nobody reads, and the thing being watched moves in weeks.
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    name: review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The only write this workflow has, and the only thing it writes: one
      # tracking issue, updated in place rather than opened again each week.
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      # Standard library only, so nothing is installed to run the check that
      # exists to watch what gets installed.
      - name: Review the locked dependency set
        id: review
        run: |
          set +e
          python scripts/check_dependencies.py > review.md
          echo "verdict=$?" >> "$GITHUB_OUTPUT"
          set -e
          cat review.md

      - name: Open or update the tracking issue
        if: steps.review.outputs.verdict != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: Dependency review
        run: |
          set -euo pipefail
          {
            echo "The scheduled dependency review found something. Nothing has been"
            echo "changed; this issue is the list to act on."
            echo
            cat review.md
            echo
            echo "---"
            echo
            echo "Updated by \`.github/workflows/dependency-review.yml\` from run"
            echo "\`${GITHUB_RUN_ID}\` against \`${GITHUB_SHA}\`. Close it when the"
            echo "list is empty or the remaining items have been accepted in writing."
          } > body.md
          # Matched by exact title rather than by label, so this cannot depend on
          # a label existing in the repository.
          number="$(gh issue list --state open --limit 100 \
                      --json number,title \
                      --jq "[.[] | select(.title == \"${TITLE}\")] | .[0].number // empty")"
          if [ -n "${number}" ]; then
            gh issue edit "${number}" --body-file body.md
            echo "Updated issue #${number}."
          else
            gh issue create --title "${TITLE}" --body-file body.md
          fi

      # Failing the run is reserved for the one outcome that is not merely
      # housekeeping. An available upgrade, or a service that could not be
      # reached, leaves the issue as the record and the run green, so a red run
      # here always means the same thing.
      - name: Fail on a known vulnerability
        if: steps.review.outputs.verdict == '3'
        run: |
          echo "A known vulnerability affects a version this project installs." >&2
          exit 1
