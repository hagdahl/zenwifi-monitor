# ZenWiFi Monitor version: 0.1.0
name: test

on:
  push:
  pull_request:

permissions:
  contents: read

# Actions are pinned to immutable commit hashes rather than moving tags, so a
# compromised or retagged upstream release cannot silently enter a build. The
# upstream release name is recorded beside each hash; update both together.
jobs:
  windows:
    name: windows (full suite)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python scripts/check_versions.py
      - run: python -m pip install --require-hashes -r requirements.lock.txt
      - run: python -m pip check
      - run: python 04_tests/test_watchdog.py
      - run: python 04_tests/test_check_versions.py
      - run: python 04_tests/test_outbox.py
      - run: python 04_tests/test_health.py
      - run: python 04_tests/test_wrapper.py

  linux:
    name: linux (platform-neutral suites)
    runs-on: ubuntu-latest
    # The watchdog still imports the Windows Credential Manager backend at
    # module scope, so test_watchdog.py and test_outbox.py cannot run here yet.
    # They are excluded deliberately, not skipped silently, and the exclusion
    # ends when the platform interfaces in section 1 of the improvement plan
    # land. test_wrapper.py reports itself skipped off Windows by design.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python scripts/check_versions.py
      - run: python -m pip install --require-hashes -r requirements.lock.txt
      - run: python -m pip check
      - run: python 04_tests/test_check_versions.py
      - run: python 04_tests/test_health.py
      - run: python 04_tests/test_wrapper.py
