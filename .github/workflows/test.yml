# ZenWiFi Monitor version: 0.1.0
name: test

on:
  push:
  pull_request:

permissions:
  contents: read

# Actions are pinned to immutable commit hashes rather than moving tags, so a
# compromised or retagged upstream release cannot silently enter a build. The
# upstream release name is recorded beside each hash; update both together.
#
# Both jobs run the same suites. An earlier revision excluded two suites from
# the Linux job on the assumption that the watchdog could not be imported
# there; that assumption was never tested and was wrong, so the exclusion
# removed real coverage for no reason. Any future exclusion belongs here in
# writing, with the reason, rather than as a shorter list of steps.
jobs:
  windows:
    name: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python scripts/check_versions.py
      - run: python -m pip install --require-hashes -r requirements.lock.txt
      - run: python -m pip check
      - run: python 04_tests/test_check_versions.py
      - run: python 04_tests/test_platform.py
      - run: python 04_tests/test_watchdog.py
      - run: python 04_tests/test_outbox.py
      - run: python 04_tests/test_health.py
      - run: python 04_tests/test_wrapper.py

  linux:
    name: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python scripts/check_versions.py
      - run: python -m pip install --require-hashes -r requirements.lock.txt
      - run: python -m pip check
      - run: python 04_tests/test_check_versions.py
      - run: python 04_tests/test_platform.py
      - run: python 04_tests/test_watchdog.py
      - run: python 04_tests/test_outbox.py
      - run: python 04_tests/test_health.py
      # The launcher suite reports itself skipped off Windows by design: it
      # drives a Windows Script Host wrapper that has no Linux counterpart
      # until the systemd deployment path in section 6 of the plan lands.
      - run: python 04_tests/test_wrapper.py
